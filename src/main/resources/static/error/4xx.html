<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Yêu cầu không hợp lệ — Mộc Anh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/moc-anh.css">
    <style>
        .err-code{font:500 clamp(72px,18vw,128px)/1 'Playfair Display',Georgia,serif;color:#c9a7a0;margin:8px 0 0;letter-spacing:2px}
        .err-box{text-align:center;padding:40px 0}
        .err-box .mt-actions{justify-content:center;margin-top:24px}
        .err-box p.err-copy{max-width:460px;margin:12px auto 0;line-height:1.7;color:#555}
    </style>
</head>
<body class="page-checkout">
<header class="site-header">
    <a class="brand" href="/customer/index.html">
        <span class="brand-mark">MA</span>
        <span><b>MỘC ANH</b><small>flower studio</small></span>
    </a>
</header>
<main id="main-content" class="flow">
    <div class="flow-shell err-box">
        <p class="eyebrow">Có chút trục trặc</p>
        <p class="err-code" aria-hidden="true">:(</p>
        <h2>Yêu cầu này <i>chưa thực hiện được</i></h2>
        <p class="err-copy">Trang hoặc thao tác bạn vừa mở không hợp lệ hoặc bạn chưa có quyền xem. Bạn hãy quay lại và thử lại.</p>
        <div class="mt-actions">
            <a class="button button-dark" id="home" href="/customer/index.html">Về trang chủ →</a>
            <button type="button" class="button button-light" id="back">← Quay lại</button>
        </div>
        <p class="err-copy" style="font-size:12.5px;color:#8a8a8a">Nếu lỗi cứ lặp lại, bạn hãy bấm "Liên hệ tiệm" ở góc màn hình để Mộc Anh hỗ trợ.</p>
    </div>
</main>
<script>
    (function () {
        // Đang ở khu quản trị thì nút trang chủ dẫn về trang Tổng quan
        var home = document.getElementById('home');
        if (location.pathname.indexOf('/admin') === 0) { home.href = '/admin/dashboard.html'; home.textContent = 'Về trang quản trị →'; }
        var back = document.getElementById('back');
        if (back) back.onclick = function () { if (history.length > 1) history.back(); else location.href = home.href; };
        var retry = document.getElementById('retry');
        if (retry) retry.onclick = function () { location.reload(); };
    })();
</script>
<script src="/js/customer/contact-fab.js"></script>
</body>
</html>
