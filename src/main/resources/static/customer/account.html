<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Tài khoản của tôi — Mộc Anh</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
          rel="stylesheet">
    <link href="/css/moc-anh.css" rel="stylesheet">
</head>
<body>
<main class="wrap">
    <section class="sec">
        <div class="sec-h"><h2>Đơn của tôi</h2><a href="#" id="lo">Đăng xuất</a></div>
        <p id="who"></p>
        <div id="ol"><p class="empty">Đang tải…</p></div>
        <div id="pg"></div>
    </section>
    <section class="sec">
        <details>
            <summary style="cursor:pointer;font-weight:600">Đổi mật khẩu</summary>
            <form class="fm" id="pwf" novalidate><label for="cp">Mật khẩu hiện tại</label><input autocomplete="current-password" id="cp"
                                                                                                 type="password"><label
                    for="np">Mật khẩu mới (từ 6 ký tự)</label><input autocomplete="new-password" id="np"
                                                                     type="password">
                <p class="err" hidden id="pwe" role="alert"></p>
                <button class="button button-dark" type="submit">Đổi mật khẩu</button>
            </form>
        </details>
        <p style="color:#6b6b60;font-size:14px;margin-top:18px">Quên mật khẩu? Vui lòng liên hệ tiệm qua Zalo để được hỗ
            trợ.</p></section>
</main>
<script src="/js/customer/layout.js"></script>
<script src="/js/customer/contact-fab.js"></script>
<script>MA.mount('',{nofilter:true});var ST={PENDING:'Chờ xác nhận',CONFIRMED:'Đã xác nhận',PREPARING:'Đang chuẩn bị',IN_PROGRESS:'Đang thực hiện',PROCESSING:'Đang thực hiện',AWAITING_APPROVAL:'Chờ bạn duyệt ảnh',READY:'Sẵn sàng giao/nhận',COMPLETED:'Hoàn thành',DELIVERED:'Hoàn thành',CANCELLED:'Đã hủy'},PY={UNPAID:'Chưa thanh toán',DEPOSITED:'Đã đặt cọc',PAID:'Đã thanh toán'},PER=10,pg=1,ALL=[];
function draw(){var el=document.getElementById('ol');if(!ALL.length){el.innerHTML='<p class="empty">Bạn chưa có đơn nào. <a href="/customer/products.html">Chọn mẫu hoa</a></p>';return}
var n=Math.max(1,Math.ceil(ALL.length/PER));if(pg>n)pg=n;
el.innerHTML=ALL.slice((pg-1)*PER,pg*PER).map(function(o){return '<a href="/customer/order-lookup.html?orderCode='+encodeURIComponent(o.orderCode)+'" style="display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:14px;margin:8px 0;border:1px solid #e6e1d4;border-radius:12px;background:#fff;color:inherit;text-decoration:none;font:15px \'Be Vietnam Pro\',sans-serif"><b>'+MA.esc(o.orderCode)+'</b><span>'+MA.esc(ST[o.status]||o.status)+' · '+MA.esc(PY[o.paymentStatus]||o.paymentStatus)+'</span><span>'+MA.money(o.payable)+'</span><small style="color:#6b6b60">'+(o.createdAt?new Date(o.createdAt).toLocaleDateString('vi-VN'):'')+'</small></a>'}).join('');
MA.pageNav(document.getElementById('pg'),ALL.length,pg,PER,function(p){pg=p;draw();window.scrollTo({top:0,behavior:'smooth'})})}
fetch('/customer/auth/me').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(u){document.getElementById('who').innerHTML='Xin chào <b>'+MA.esc(u.name||'')+'</b> · '+MA.esc(u.phone);
return fetch('/customer/auth/orders').then(function(r){return r.json()})}).then(function(L){ALL=L;draw()}).catch(function(){location.href='/customer/login.html?next=/customer/account.html'});
document.getElementById('pwf').onsubmit=function(e){e.preventDefault();var er=document.getElementById('pwe');er.hidden=true;
fetch('/customer/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:document.getElementById('cp').value,newPassword:document.getElementById('np').value})})
.then(function(r){return r.json().catch(function(){return null}).then(function(d){if(!r.ok)throw new Error((d&&d.message)||'Lỗi máy chủ ('+r.status+')');er.hidden=false;er.style.color='#2f4538';er.textContent='Đã đổi mật khẩu.';document.getElementById('pwf').reset()})})
.catch(function(x){er.hidden=false;er.style.color='#9a504b';er.textContent=x.message})};
document.getElementById('lo').onclick=function(e){e.preventDefault();fetch('/customer/auth/logout',{method:'POST'}).then(function(){location.href='/customer/index.html'})};
</script>
</body>
</html>
