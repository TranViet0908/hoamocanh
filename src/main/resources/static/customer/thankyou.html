<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đặt hoa thành công — Mộc Anh</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/design.css">
</head>
<body>
<main class="flow">
    <div class="flow-shell" style="text-align:center">
        <span class="brand-mark" style="margin:auto">MA</span>
        <p class="eyebrow" style="margin-top:18px">Mộc Anh Flower Studio</p>
        <h1 style="font:normal clamp(34px,8vw,52px) Georgia,serif;margin:0 0 20px">Cảm ơn bạn đã gửi yêu cầu.</h1>
        <p style="color:var(--muted);line-height:1.7">Đơn hàng đã được ghi nhận. Nhân viên Mộc Anh sẽ liên hệ để xác nhận thông tin và thời gian nhận hoa.</p>
        <p id="orderLine" hidden>Mã đơn: <b id="orderCode"></b></p>

        <!-- Gửi tặng online: QR + link -->
        <div class="mt-box" id="giftBox" hidden>
            <h4>Món quà của bạn</h4>
            <div class="mt-qr" id="qrWrap">
                <div id="qrCanvas"></div>
                <span class="mt-qr-logo">MA</span>
            </div>
            <p class="mt-link" id="giftLink"></p>
            <div class="mt-actions">
                <button type="button" class="button button-light" id="copyLink">Sao chép link</button>
                <button type="button" class="button button-light" id="shareLink" hidden>Chia sẻ</button>
                <a class="button button-light" id="openGift" target="_blank" rel="noopener">Xem trang quà</a>
            </div>
            <p style="font-size:11px;color:var(--muted)">Quét mã hoặc mở link để xem lời chúc bạn đã gửi.</p>
        </div>

        <!-- Thanh toán -->
        <div class="mt-box" id="payBox" hidden>
            <h4 id="payTitle">Thanh toán</h4>
            <div id="payBody"></div>
        </div>

        <!-- Liên hệ -->
        <div class="mt-actions" id="contact" hidden></div>

        <p style="margin-top:30px"><a class="button button-dark" href="/customer/index.html">Về trang chủ →</a></p>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/customer/shop.js"></script>
<script src="/js/customer/thankyou.js"></script>
</body>
</html>
