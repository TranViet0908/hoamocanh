<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mộc Anh — Tự thiết kế hoa</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/customer/index.html">
    <span class="brand-mark">MA</span><span><b>MỘC ANH</b><small>flower studio</small></span>
  </a>
  <a class="admin-link" href="/admin/login.html">Quản trị <span>↗</span></a>
</header>
<main>
  <section class="hero">
    <div>
      <p class="eyebrow">Tự tay tạo nên điều đặc biệt</p>
      <h1>Một bó hoa,<br><i>một câu chuyện</i> của riêng bạn.</h1>
      <p class="hero-copy">Chọn nguyên liệu đang có trong ngày, phối theo gu của bạn và để Mộc Anh biến ý tưởng thành món quà thật đẹp.</p>
      <!-- Nút này giờ sẽ trỏ thẳng sang file design.html -->
      <a class="button button-dark" href="/customer/design.html">Bắt đầu thiết kế <span>→</span></a>
    </div>
    <div class="hero-photo">
      <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=900&q=85" alt="Bó hoa tươi tone hồng kem">
    </div>
  </section>
  <section id="types" style="padding:32px 20px;max-width:960px;margin:auto" hidden>
    <p class="eyebrow">Bạn có thể thiết kế</p>
    <div id="typeList" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px"></div>
  </section>
</main>
<script>
  fetch('/customer/products/types')
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      if (!list.length) return;
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      document.getElementById('typeList').innerHTML = list
        .map(t => `<a class="button button-light" href="/customer/design.html">${esc(t.name ?? t.typeName)}</a>`).join('');
      document.getElementById('types').hidden = false;
    })
    .catch(() => {});
</script>
</body>
</html>
