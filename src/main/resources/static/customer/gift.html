<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Một món quà dành cho bạn — Mộc Anh</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/moc-anh.css">
</head>
<body class="page-gift">
<a class="skip-link" href="#gift">Bỏ qua đến nội dung</a>
<div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<main class="gift-page">
    <a class="brand" href="/customer/index.html">
        <span class="brand-mark">MA</span>
        <span><b>MỘC ANH</b><small>flower studio</small></span>
    </a>

    <div id="loading" class="gift-error">Đang mở món quà...</div>
    <div id="error" class="gift-error" hidden></div>

    <!-- MỚI: Khối yêu cầu nhập mật khẩu -->
    <section id="unlockSection" hidden style="max-width: 400px; margin: 40px auto; padding: 34px 24px; background: #fff; border-radius: 24px; box-shadow: var(--shadow); text-align: center; position: relative; z-index: 2;">
        <div style="width: 54px; height: 54px; background: var(--blush); color: var(--rose-deep); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px;">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 11v-2a4 4 0 0 1 8 0v2m-10 0h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z"/></svg>
        </div>
        <h2 style="font-size: 26px; margin: 0 0 10px; font-family: var(--serif);">Món quà <i>bí mật</i></h2>
        <p class="gift-from" id="unlockFrom" style="margin-bottom: 6px;"></p>
        <p style="font-size: 13px; color: var(--muted); margin-bottom: 24px;" id="unlockHint"></p>

        <form id="unlockForm" onsubmit="return false;">
            <input type="text" id="unlockPwd" placeholder="Nhập mã mở quà..." required style="text-align: center; font-size: 16px; letter-spacing: 2px; margin-bottom: 14px; background: var(--cream);">
            <button type="submit" class="button button-dark" style="width: 100%;" id="unlockBtn">Mở khóa ngay</button>
            <p id="unlockError" style="color: var(--rose-deep); font-size: 13px; margin-top: 12px; display: none;"></p>
        </form>
    </section>

    <!-- Nội dung quà bị che -->
    <section id="gift" hidden tabindex="-1">
        <p class="eyebrow">Một món quà dành cho bạn</p>
        <h1 class="gift-title" id="giftTitle">Gửi bạn <i>đóa hoa</i> này</h1>
        <p class="gift-from" id="giftFrom"></p>
        <p class="gift-message" id="giftMessage"></p>
        <div class="gift-media" id="giftMedia"></div>
        <div class="gift-bouquet">
            <p class="eyebrow" style="margin:0">Bó hoa được phối từ</p>
            <div class="mt-collage" id="giftCollage"></div>
            <p class="gift-meta" id="giftMeta"></p>
        </div>
        <p class="gift-note">Hình ảnh mang tính mô phỏng. Sản phẩm thực tế có thể thay đổi theo nguồn hoa tươi trong ngày.</p>
        <p style="margin-top:28px"><a class="button button-dark" href="/customer/index.html">Tự thiết kế hoa của bạn →</a></p>
    </section>

    <div class="mt-actions" id="contact" hidden style="margin-top:24px"></div>
</main>
<script src="/js/customer/shop.js"></script>
<script src="/js/customer/gift.js"></script>
</body>
</html>
