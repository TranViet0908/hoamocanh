<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lịch trải nghiệm — Mộc Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .cl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .cl-bar .adm-input{width:auto}
    .cl-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
    .cl-strip button{flex:none;min-width:74px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;text-align:center}
    .cl-strip button small{display:block;color:var(--muted);font-size:11px}.cl-strip button b{display:block;font-size:15px}
    .cl-strip button i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
    .cl-strip button.busy i{color:var(--accent);font-weight:600}
    .cl-strip button.on{background:var(--ink);border-color:var(--ink);color:#fff}.cl-strip button.on small,.cl-strip button.on i{color:#cfdbd9}
    .cl-day h2{font-size:24px;margin-bottom:12px}
    .cl-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
    .cl-slot{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .cl-slot header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .cl-slot header b{font-size:16px}
    .cl-bar2{height:6px;border-radius:99px;background:#eceae3;overflow:hidden;margin-bottom:10px}.cl-bar2 span{display:block;height:100%;background:var(--accent)}
    .cl-bk{display:block;text-decoration:none;color:inherit;padding:9px 0;border-top:1px solid #efece5}
    .cl-bk:hover b{color:var(--accent)}.cl-bk small{color:var(--muted)}
    .cl-bk div{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .cl-empty{color:var(--muted);font-size:13px;padding:6px 0}
    .cl-cfg{margin-top:20px}.cl-cfg h2{font-size:22px;margin-bottom:6px}
    .cl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
    .cl-row label{display:grid;gap:4px;font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
  <script src="/js/admin/admin-core.js"></script>
  <script src="/js/admin/calendar.js"></script>
</body>
</html>
