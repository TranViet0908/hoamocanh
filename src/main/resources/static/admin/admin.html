<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mộc Anh — Quản trị</title><link rel="stylesheet" href="/css/styles.css"></head><body class="admin-body"><div class="admin-layout"><aside class="sidebar"><a class="brand" href="/customer/index.html"><span class="brand-mark">MA</span><span><b>MỘC ANH</b><small>flower studio</small></span></a><a class="side-link active" href="#inventory">Kho hoa</a><a class="side-link" href="#orders">Đơn hàng</a><a class="side-link" href="/customer/index.html">← Về trang khách</a></aside><main class="admin-main"><div class="admin-top"><div><p class="eyebrow">Xin chào, An</p><h1>Quản trị hôm nay</h1></div><button class="button button-dark" onclick="alert('Mở form thêm nguyên liệu')">+ Thêm nguyên liệu</button></div><section id="inventory" class="admin-card"><div class="admin-top"><h2>Kho nguyên liệu</h2><span class="step-label">CẬP NHẬT 10:42</span></div><table class="admin-table"><thead><tr><th>NGUYÊN LIỆU</th><th>LOẠI</th><th>GIÁ</th><th>TỒN KHO</th><th>TRẠNG THÁI</th></tr></thead><tbody id="inventoryBody"></tbody></table></section><section id="orders" class="admin-card" style="margin-top:22px"><div class="admin-top"><h2>Đơn hàng mới</h2><span class="step-label">3 ĐƠN CHỜ XỬ LÝ</span></div><table class="admin-table"><thead><tr><th>MÃ ĐƠN</th><th>KHÁCH HÀNG</th><th>HÌNH THỨC</th><th>TỔNG TIỀN</th><th>TRẠNG THÁI</th></tr></thead><tbody id="ordersBody"></tbody></table></section></main></div><script>const API_BASE_ADMIN='http://localhost:8080/admin';const inv=[['Hoa hồng kem','Hoa & lá','85.000đ',24],['Cẩm tú cầu xanh','Hoa & lá','120.000đ',8],['Cúc tana','Hoa & lá','65.000đ',42],['Nơ lụa linen','Phụ kiện','30.000đ',16],['Giấy gói kraft','Bao bì','40.000đ',31]];document.querySelector('#inventoryBody').innerHTML=inv.map((x,i)=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]} phần</td><td><button class="toggle" onclick="this.textContent=this.textContent.includes('Còn')?'Hết hàng':'Còn hàng'">Còn hàng</button></td></tr>`).join('');const orders=[['#MA-1024','Nguyễn Thùy An','Gửi tặng online','780.000đ'],['#MA-1023','Trần Minh Khang','Mộc Anh làm giúp','1.200.000đ'],['#MA-1022','Lê Hoàng Yến','Tự làm tại tiệm','650.000đ']];document.querySelector('#ordersBody').innerHTML=orders.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><select class="status" onchange="fetch(API_BASE_ADMIN+'/orders/${x[0].slice(1)}/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:this.value})}).catch(()=>{})"><option>Khởi tạo</option><option>Xác nhận</option><option>Thực hiện</option><option>Hoàn tất</option></select></td></tr>`).join('');async function loadInventory(){try{return fetch(API_BASE_ADMIN+'/materials')}catch(e){return inv}}async function updateMaterial(id,data){return fetch(API_BASE_ADMIN+'/materials/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}</script></body></html>
