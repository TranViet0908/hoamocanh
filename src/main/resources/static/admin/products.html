<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sản phẩm mẫu — Mộc Anh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .pr-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
        .pr-bar .adm-input{flex:1;min-width:160px}
        .pr-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #efece5;cursor:pointer}
        .pr-row:hover{background:#faf8f3}
        .pr-row img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--cream)}
        .pr-row .mid{flex:1;min-width:0}.pr-row small{color:var(--muted)}
        .pr-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:center;justify-content:center;padding:14px}
        .pr-modal.on{display:flex}
        .pr-box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px}
        .pr-box img.big{width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-bottom:12px}
    </style>
</head>
<body>
<script src="/js/admin/admin-core.js"></script>
<script src="/js/admin/products.js"></script>
</body>
</html>
