<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập quản trị — Mộc Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="adm">
  <main class="adm-login">
    <div class="adm-card">
      <a class="adm-brand" href="/customer/index.html"><span class="adm-mark">MA</span><span><b>MỘC ANH</b><small>flower studio</small></span></a>
      <h1>Xin chào.</h1>
      <p class="adm-muted" style="margin:0 0 22px">Đăng nhập để cập nhật kho và xử lý đơn hàng.</p>
      <form id="loginForm" novalidate>
        <label class="adm-field">Số điện thoại
          <input class="adm-input" name="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="09xx xxx xxx" required>
        </label>
        <label class="adm-field">Mật khẩu
          <input class="adm-input" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="adm-error" id="loginError" role="alert"></p>
        <button class="adm-btn primary" style="width:100%" type="submit">Đăng nhập →</button>
      </form>
    </div>
  </main>
  <script src="/js/admin/admin-core.js"></script>
  <script>
    const form = document.getElementById('loginForm'), err = document.getElementById('loginError');
    // Đã đăng nhập sẵn thì vào thẳng trang tổng quan
    Admin.api('/auth/me').then(() => location.replace('dashboard.html')).catch(() => {});

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = form.querySelector('button'), fd = new FormData(form);
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
      try {
        await Admin.api('/auth/login', { method: 'POST', body: { phone: fd.get('phone'), password: fd.get('password') } });
        location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false; btn.textContent = 'Đăng nhập →';
      }
    });
  </script>
</body>
</html>
