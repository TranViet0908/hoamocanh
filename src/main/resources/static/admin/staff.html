<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nhân viên — Mộc Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .st-act{display:flex;gap:6px;flex-wrap:wrap}
    .st-act button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px}
    .st-act button:hover:not(:disabled){border-color:var(--accent)}.st-act button:disabled{opacity:.4;cursor:not-allowed}
    .st-off{opacity:.55}
    .st-hint{background:var(--cream);border-radius:10px;padding:10px 14px;color:var(--muted);margin-bottom:14px;line-height:1.6}
  </style>
