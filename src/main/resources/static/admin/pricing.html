<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mức giá & định mức — Mộc Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .pr-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
    .pr-tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 18px;cursor:pointer}
    .pr-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
    .pr-note{background:var(--cream);border-radius:12px;padding:12px 16px;margin-bottom:14px;color:var(--muted);line-height:1.6}
    .pr-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .pr-row label{display:grid;gap:4px;font-size:11px;color:var(--muted)}
    .pr-n{width:84px;min-height:40px;padding:6px 8px;text-align:center}
    .pr-card h2{font-size:22px;margin-bottom:10px}
    .pr-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:8px 0 14px}
    .pr-chk{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
    .pr-chk small{color:var(--muted);margin-left:auto}
    .pr-stack>*{margin-bottom:14px}
    .adm-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .pr-save[disabled]{opacity:.4}
    @media(max-width:760px){.adm-2col{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <script src="/js/admin/admin-core.js"></script>
  <script src="/js/admin/pricing.js"></script>
</body>
</html>
