<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đơn hàng — Mộc Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .od-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
    .od-tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;cursor:pointer}
    .od-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
    .od-tabs b{margin-left:6px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px}
    .od-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .od-bar .adm-input{flex:1;min-width:200px}.od-bar select.adm-input{flex:none;width:auto;min-width:170px}
    .od-table tr{cursor:pointer}.od-table tbody tr:hover{background:#faf8f3}
    .od-empty{text-align:center;padding:36px 10px;color:var(--muted)}
    .od-sec{margin-bottom:22px}.od-sec h3{font-size:18px;margin-bottom:10px}
    .od-kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px}.od-kv span{color:var(--muted)}
    .od-item{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #efece5}
    .od-item img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--cream)}
    .od-item div{flex:1}.od-item small{color:var(--muted)}
    .od-gift{background:var(--cream);border-radius:10px;padding:12px;white-space:pre-line}
    .od-gift img,.od-gift video{max-width:100%;border-radius:8px;margin-top:8px}
    .od-pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .od-pay .full{grid-column:1 / -1}
    .od-hist{list-style:none;margin:0;padding:0}.od-hist li{padding:8px 0 8px 14px;border-left:2px solid var(--line);position:relative}
    .od-hist li:before{content:'';position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
    .od-hist small{display:block;color:var(--muted)}
    .od-actions{display:flex;gap:8px;flex-wrap:wrap}.od-actions .adm-btn{flex:1}
    .adm-btn.bad{color:var(--bad);border-color:#e7c3bf}.adm-btn.bad.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
  </style>
</head>
<body>
  <script src="/js/admin/admin-core.js"></script>
  <script src="/js/admin/orders.js"></script>
</body>
</html>
