<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mẫu & Flash sale — Mộc Anh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .cu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:14px}
        .cu-it{position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding:0;text-align:left;font:inherit}
        .cu-it img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--cream)}
        .cu-it small{display:block;padding:4px 6px;color:var(--muted)}
        .cu-it.on{border-color:var(--accent)}
        .cu-it.on:after{content:'✓';position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
        .cu-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .cu-bar .adm-input{flex:1;min-width:150px}
    </style>
</head>
<body>
<script src="/js/admin/admin-core.js"></script>
<script src="/js/admin/curation.js"></script>
</body>
</html>
