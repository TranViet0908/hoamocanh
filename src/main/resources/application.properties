# C?u hình k?t n?i MySQL theo file hoamocanh_db.sql[cite: 33]
spring.datasource.url=jdbc:mysql://localhost:3306/hoamocanh_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Namtun123@
